org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Fix Windows cross-drive Kotlin incremental cache failure
# (Pub cache on C: vs project on D: -> RelocatableFileToPathConverter IllegalArgumentException)
kotlin.incremental=false
kotlin.incremental.android=false

org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.enableAapt2Daemon=false
