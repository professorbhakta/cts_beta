name: cts
description: "Commuter Transport System"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
#  fluttertoast: ^9.0.0

  firebase_messaging: 16.5.0


  flutter_native_splash: ^2.4.1
  http: ^1.6.0
  dio: ^5.11.0
  dio_cookie_manager: ^3.5.0
  path_provider: ^2.1.4
  cookie_jar: ^4.0.8
  device_info_plus: ^13.2.0
  easy_splash_screen: ^1.0.4
  flutter_easyloading: ^4.0.2
  flutter_slidable: ^4.0.3
  sqflite: ^2.3.3
  shared_preferences: ^2.3.2
  filter_list: ^1.0.3
  # For Date And Time Format
  intl: ^0.20.2
  permission_handler: ^13.0.1
  dropdown_search: ^7.0.0
  # url links
  url_launcher: ^6.3.0

  dropdown_button2: ^2.3.9
  #internet
  connectivity_plus: ^7.0.0
  web_socket_channel: 3.0.3
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^6.0.1
  google_fonts: ^6.2.1
  auto_size_text: ^3.0.0
  shimmer: ^4.0.0
  share_plus: ^13.3.0
  path: ^1.9.1
  go_router: ^18.0.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.0
  webview_flutter_wkwebview: ^3.26.0
  # Client pack (QR boarding + odometer photo) — camera only, no gallery
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  wakelock_plus: ^1.3.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Loaded by flutter_dotenv in AppConfig.initialize(); copy .env.example → .env
    - .env
    - assets/images/c2sSplashscreen.png
    - assets/images/c2s.png
    - assets/images/logo-color.png
    - assets/images/splashimg.jpg
    - assets/images/bus_stop.jpg
    - assets/images/c2s_image.jpg
    - assets/images/login-Bg.jpg
    - assets/images/batches.png
    - assets/images/education.png
    - assets/images/driver.png
    - assets/images/van.png
    - assets/images/route.png
    - assets/images/pop.png
    - assets/images/system-data.png
    - assets/images/ecco.jpeg
    - assets/images/c2s-01-logo.png
    - assets/images/cts_icon.png
    - assets/brand/cts_logo.svg
    - assets/brand/cts_favicon.svg
    - assets/img/batch.png
    - assets/img/cab.PNG
    - assets/img/driver.png
    - assets/img/pop.png
    - assets/img/route.png
    - assets/img/student.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/brand/cts_icon_master.png"
    background_color: "#F7F4EE"
    theme_color: "#F5C400"
  image_path: "assets/brand/cts_icon_master.png"
  adaptive_icon_background: "#F7F4EE"
  adaptive_icon_foreground: "assets/brand/cts_icon_master.png"
  remove_alpha_ios: true
  
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
